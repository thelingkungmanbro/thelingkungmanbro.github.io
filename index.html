<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WebByWanmoyyAgain</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =====================================
         MUSIC
    ====================================== -->

    <audio id="bgMusic" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <button id="musicButton" class="music-button">
        ♫ <span id="musicText">MUSIC</span>
    </button>


    <!-- =====================================
         INTRO
    ====================================== -->

    <section id="intro" class="page active">

        <div id="starField" class="star-field"></div>

        <div class="intro-content">

            <div id="introText" class="digital-text">
                
            </div>

            <div id="heart" class="big-heart">
                ♡
            </div>

        </div>

    </section>


    <!-- =====================================
         NOTEBOOK COVER
    ====================================== -->

    <section id="coverPage" class="page">

        <div id="coverStars" class="star-field"></div>

        <div class="cover-container">

            <div class="closed-book">

                <div class="book-decoration">
                    ♡
                </div>

                <div class="book-title">
                    FOR Ticha
                </div>

                <div class="book-date">
                    กดเบิ่งดูแนหล่าา
                </div>

            </div>

            <button id="openBookBtn" class="main-button">
                OPEN 
            </button>

        </div>

    </section>


    <!-- =====================================
         NOTEBOOK
    ====================================== -->

    <section id="notebookPage" class="page">

        <div id="notebookStars" class="star-field"></div>

        <div class="notebook-area">

            <div id="notebook" class="notebook">

                <div class="paper left-paper">

                    <div id="leftContent" class="paper-content"></div>

                </div>


                <div class="paper right-paper">

                    <div id="rightContent" class="paper-content"></div>

                </div>

            </div>


            <div class="buttons">

                <button id="prevBtn">
                    ← ก่อนหน้า
                </button>

                <button id="nextBtn">
                    หน้าถัดไป →
                </button>

                <button id="closeBtn">
                    ปิดสมุด ♡
                </button>

            </div>

        </div>

    </section>


    <!-- =====================================
         FLOWER MESSAGE
    ====================================== -->

    <section id="flowerMessagePage" class="page">

        <div id="messageStars" class="star-field"></div>

        <div id="flowerMessage">
            THE LAST
            IS
        </div>

    </section>


    <!-- =====================================
         PIXEL FLOWER
    ====================================== -->

    <section id="flowerPage" class="page">

        <div id="flowerStars" class="star-field"></div>

        <div class="flower-container">

            <div class="flower-glow"></div>

            <canvas
                id="flowerCanvas"
                width="180"
                height="220">
            </canvas>

            <div class="flower-caption">
                FOR TICHA NAA <3
                P luv ticha t suddd
            </div>

        </div>

    </section>


    <script src="script.js"></script>

</body>

</html>
